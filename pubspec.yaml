name: grpc
description: Dart implementation of gRPC, a high performance, open-source universal RPC framework.
version: 4.0.0

repository: https://github.com/grpc/grpc-dart

environment:
  sdk: ^3.13.3

dependencies:
  async: ^2.13.1
  crypto: ^3.0.8
  fixnum: ^1.1.0
  googleapis_auth: ^2.3.7
  meta: ^1.19.0
  http: '>=1.6.0 <2.0.0'
  http2: ^3.1.0
  protobuf: '>=6.1.0 <7.0.0'
  clock: ^1.1.3

dev_dependencies:
  build_runner: ^2.16.2
  build_test: ^3.5.21
  lints: "^6.1.0"
  mockito: ^5.8.1
  path: ^1.9.0
  test: ^1.31.1
  stream_channel: ^2.1.4
  stream_transform: ^2.1.2
  vm_service: ^15.4.0
  fake_async: ^1.3.3

false_secrets:
 - interop/server1.key
 - test/data/localhost.key

topics:
 - grpc
 - rpc
 - protocols
